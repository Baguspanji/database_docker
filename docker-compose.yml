services:
  mysql:
    container_name: mysql
    image: mysql:8.2
    # command: mysqld --sql_mode="traditional" --default-authentication-plugin=mysql_native_password --log_bin_trust_function_creators=1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./restore_mysql:/home/restore_mysql
      - ./mysql:/var/lib/mysql
      # - mysql_data:/var/lib/mysql
    networks:
      - net
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - "-p root"
      retries: 3
      timeout: 5s

    pgsql:
      container_name: pgsql
      image: postgres:12-alpine
      volumes:
        - ./pgsql:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=root
        - POSTGRES_PASSWORD=root
        - POSTGRES_DB=net
      ports:
        - 5432:5432
      networks:
        - net

    mongo:
      container_name: mongo
      image: mongo:4.2.3
      volumes:
        - ./mongo:/data/db
      ports:
        - 27017:27017
      environment:
        - MONGO_INITDB_ROOT_USERNAME=root
        - MONGO_INITDB_ROOT_PASSWORD=root
      networks:
        - net

    redis:
      image: redis:latest
      container_name: redis
      environment:
        - REDIS_PASSWORD=redis
      # command: redis-server --requirepass ${REDIS_PASSWORD}
      volumes:
        - ./redis:/data/db
      ports:
        - 6379:6379
      networks:
        - net
      healthcheck:
        test:
          - CMD
          - redis-cli
          - ping
        retries: 3
        timeout: 5s

  adminer:
    image: adminer:latest
    container_name: adminer
    # volumes:
    #   - ./adminer:/var/www/html
    ports:
      - 8080:8080
    command: [ "php", "-d", "post_max_size=500M", "-d", "upload_max_filesize=500M", "-S", "0.0.0.0:8080", "-t", "/var/www/html" ]
    networks:
      - net

  databasus:
    image: databasus/databasus:latest
    container_name: databasus
    volumes:
      - ./databasus-data:/databasus-data
    ports:
      - "4005:4005"
    # restart: unless-stopped
    networks:
      - net

networks:
  net:
    driver: bridge
