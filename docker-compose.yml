services:
  mysql:
    container_name: mysql
    image: mysql:8.2
    # command: mysqld --sql_mode="traditional" --default-authentication-plugin=mysql_native_password --log_bin_trust_function_creators=1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./restore_mysql:/home/restore_mysql
      - ./mysql:/var/lib/mysql
      # - mysql_data:/var/lib/mysql
    networks:
      - net
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - "-p root"
      retries: 3
      timeout: 5s

  adminer:
    # image: wodby/adminer:latest
    image: dockette/adminer:full
    container_name: adminer
    ports:
      # - "8080:9000"
      - "8080:80"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: flat
      ADMINER_DEFAULT_LANG: en
    volumes:
      #   - ./adminer:/var/www/html
      - ./adminer:/srv
    # command: [ "php", "-d", "post_max_size=500M", "-d", "upload_max_filesize=500M", "-S", "0.0.0.0:9000", "-t", "/var/www/html" ]
    networks:
      - net
