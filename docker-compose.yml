services:
  mysql:
    container_name: mysql
    image: mysql:8.2
    # command: mysqld --sql_mode="traditional" --default-authentication-plugin=mysql_native_password --log_bin_trust_function_creators=1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./restore_mysql:/home/restore_mysql
      - ./mysql:/var/lib/mysql
      # - mysql_data:/var/lib/mysql
    networks:
      - net
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - "-p root"
      retries: 3
      timeout: 5s

  adminer:
    # image: wodby/adminer:latest
    image: dockette/adminer:latest
    container_name: adminer
    ports:
      # - "8080:9000"
      - "8080:80"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: flat
      ADMINER_DEFAULT_LANG: en
    volumes:
      #   - ./adminer:/var/www/html
      - ./adminer:/srv
      # - /Users/baguspanji:/mnt/data
      # command: [ "php", "-d", "post_max_size=500M", "-d", "upload_max_filesize=500M", "-S", "0.0.0.0:9000", "-t", "/var/www/html" ]
    networks:
      - net

  redis:
    image: redis:latest
    container_name: redis
    environment:
      - REDIS_PASSWORD=redis
    # command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis:/data/db
    ports:
      - 6379:6379
    networks:
      - net
    # healthcheck:
    #   test:
    #     - CMD
    #     - redis-cli
    #     - ping
    #   retries: 3
    #   timeout: 5s
    # databasus:
    #   image: databasus/databasus:latest
    #   container_name: databasus
    #   volumes:
    #     - ./databasus-data:/databasus-data
    #   ports:
    #     - "4005:4005"
    #   # restart: unless-stopped
    #   networks:
    #     - net

  pgsql:
    container_name: pgsql
    build:
      context: .
      dockerfile: Dockerfile.pgsql
    image: pgsql-custom:17
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      # - ./pgsql:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=db_initial
    ports:
      - 5432:5432
    networks:
      - net

  mongo:
    container_name: mongo
    image: mongo:4.2.3
    volumes:
      - ./mongo:/data/db
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
    networks:
      - net

  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:latest
    environment:
      - CLICKHOUSE_USER=root
      - CLICKHOUSE_PASSWORD=root
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - ./clickhouse:/var/lib/clickhouse
    ports:
      - 127.0.0.1:8123:8123
      - 127.0.0.1:9000:9000
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - net

  mailpit:
    container_name: mailpit
    image: axllent/mailpit:latest
    ports:
      - 1025:1025
      - 8025:8025
    networks:
      - net

  mailgun-relay:
    image: fametec/postfix-mailgun:latest
    container_name: mailgun_relay
    restart: unless-stopped
    ports:
      - "2525:25"
    networks:
      - net
    environment:
      MAILGUN_USER: "noreply@kodebagus.com"
      MAILGUN_PASS: "ZzRjXR@*pKq{"
      MAILGUN_RELAYHOST: "mail.kodebagus.com"

volumes:
  postgres_data:

networks:
  net:
    driver: bridge
